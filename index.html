
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos Cusco</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        button {
            background: #2779bd;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        input, select {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Pedidos de Comida Cusqueña</h1>
    <p>Sistema básico de registro de pedidos</p>

    <h3>Nuevo pedido</h3>

    <input type="text" id="cliente"
           placeholder="Nombre del cliente">

    <select id="plato">
        <option value="Chiri Uchu">Chiri Uchu</option>
        <option value="Chairo">Chairo</option>
        <option value="Cuy al horno">Cuy al horno</option>
        <option value="Adobo cusqueño">Adobo cusqueño</option>
    </select>

    <button onclick="agregarPedido()">
        Registrar pedido
    </button>

    <h3>Pedidos registrados</h3>
    <ul id="pedidos"></ul>

    <script>
        function agregarPedido() {
            let cliente = document.getElementById("cliente").value.trim();
            let plato = document.getElementById("plato").value;

            if (cliente === "") {
                alert("Ingrese el nombre del cliente");
                return;
            }

            let lista = document.getElementById("pedidos");
            let nuevo = document.createElement("li");

            nuevo.textContent = cliente + " - " + plato;
            lista.appendChild(nuevo);

            document.getElementById("cliente").value = "";
        }
    </script>

</body>
</html>
